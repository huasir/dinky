# LTSK / 公司仓 GitLab CI
# - Runner 标签 global-ltd
# - Maven 镜像：Harbor cicd/maven-microsoft-openjdk:3.9.6-17（JDK17）
# - 打包前需 install 本地 lib/ 中的 Vastbase 私有 jar（Nexus 无此制品）
# - 不自动部署：部署用 script/ltsk/deploy-release.sh

stages:
  - check
  - package

variables:
  MAVEN_OPTS: "-Xmx2G -Xms2G"
  # 注意：本仓库无 scala-2.12 profile
  DINKY_MVN_PROFILES: "prod,jdk11,flink-single-version,flink-1.20,web"
  GIT_DEPTH: "0"
  MAVEN_CONFIG: ""

.default_maven:
  image: 10.0.0.17:3060/cicd/maven-microsoft-openjdk:3.9.6-17
  tags:
    - global-ltd
  before_script:
    - unset MAVEN_CONFIG || true
    - java -version
    - mvn -v

.install_vastbase_jars: &install_vastbase_jars
  - unset MAVEN_CONFIG || true
  # 该镜像无 bash，使用 sh
  - sh dinky-flink/dinky-flink-1.20/install_jar.sh

spotless:
  extends: .default_maven
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^vendor\//
    - if: $CI_COMMIT_TAG =~ /^ltsk-/
  script:
    - unset MAVEN_CONFIG || true
    - mvn -B --no-transfer-progress spotless:check -P flink-all -Dspotless.ratchetFrom=HEAD

package-branch:
  extends: .default_maven
  stage: package
  needs: ["spotless"]
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^vendor\//
  script:
    - *install_vastbase_jars
    - mvn -B --no-transfer-progress clean package -DskipTests=true -Dspotless.check.skip=true -P ${DINKY_MVN_PROFILES}
    - ls -lh build/ || true
  artifacts:
    name: "dinky-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/*.tar.gz
    expire_in: 7 days
    when: on_success

package-tag:
  extends: .default_maven
  stage: package
  needs: ["spotless"]
  rules:
    - if: $CI_COMMIT_TAG =~ /^ltsk-/
  script:
    - *install_vastbase_jars
    - mvn -B --no-transfer-progress clean package -DskipTests=true -Dspotless.check.skip=true -P ${DINKY_MVN_PROFILES}
    - ls -lh build/
    - |
      echo "制品已生成。部署请执行："
      echo "  ./script/ltsk/deploy-release.sh --env <deploy.env> --package build/dinky-release-*.tar.gz"
  artifacts:
    name: "dinky-$CI_COMMIT_TAG"
    paths:
      - build/*.tar.gz
    expire_in: 30 days
    when: on_success
