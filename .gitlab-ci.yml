# LTSK / 公司仓 GitLab CI
# - Runner 标签 global-ltd
# - Maven 镜像：Harbor cicd/maven-microsoft-openjdk:3.9.6-17（JDK17；公司无现成 JDK11+Maven+Nexus 组合）
# - 自动：格式检查 + 打包制品
# - 不自动部署：部署用 script/ltsk/deploy-release.sh
#
# 注意：公司部分镜像会设置 MAVEN_CONFIG=/root/.m2；对 mvnw 会变成非法 CLI 参数。
#       本流水线改用 mvn，并 unset MAVEN_CONFIG。

stages:
  - check
  - package

variables:
  MAVEN_OPTS: "-Xmx2G -Xms2G"
  DINKY_MVN_PROFILES: "prod,jdk11,flink-single-version,scala-2.12,flink-1.20,web"
  GIT_DEPTH: "0"
  MAVEN_CONFIG: ""

.default_maven:
  # 真身在 Harbor：与短名 liudonglin/maven:ltd-cd-nexus（JDK8）不同
  image: 10.0.0.17:3060/cicd/maven-microsoft-openjdk:3.9.6-17
  tags:
    - global-ltd
  before_script:
    - unset MAVEN_CONFIG || true
    - java -version
    - mvn -v

spotless:
  extends: .default_maven
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^vendor\//
    - if: $CI_COMMIT_TAG =~ /^ltsk-/
  script:
    - unset MAVEN_CONFIG || true
    - mvn -B --no-transfer-progress spotless:check -P flink-all -Dspotless.ratchetFrom=HEAD

package-branch:
  extends: .default_maven
  stage: package
  needs: ["spotless"]
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^vendor\//
  script:
    - unset MAVEN_CONFIG || true
    - mvn -B --no-transfer-progress clean package -DskipTests=true -Dspotless.check.skip=true -P ${DINKY_MVN_PROFILES}
    - ls -lh build/ || true
  artifacts:
    name: "dinky-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/*.tar.gz
    expire_in: 7 days
    when: on_success

package-tag:
  extends: .default_maven
  stage: package
  needs: ["spotless"]
  rules:
    - if: $CI_COMMIT_TAG =~ /^ltsk-/
  script:
    - unset MAVEN_CONFIG || true
    - mvn -B --no-transfer-progress clean package -DskipTests=true -Dspotless.check.skip=true -P ${DINKY_MVN_PROFILES}
    - ls -lh build/
    - |
      echo "制品已生成。部署请执行："
      echo "  ./script/ltsk/deploy-release.sh --env <deploy.env> --package build/dinky-release-*.tar.gz"
  artifacts:
    name: "dinky-$CI_COMMIT_TAG"
    paths:
      - build/*.tar.gz
    expire_in: 30 days
    when: on_success
